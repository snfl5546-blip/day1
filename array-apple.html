<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사과 배열 반복문 애니메이션</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Malgun Gothic", sans-serif; color: #f8fafc; padding: 16px; min-height: 100vh;
      background: linear-gradient(135deg, #1e1b4b, #4c1d95 50%, #831843);
      background-attachment: fixed; overflow-x: hidden;
    }
    /* 떠다니는 배경 빛 */
    .blob { position: fixed; border-radius: 50%; filter: blur(70px); opacity: .35; z-index: 0; animation: float 12s ease-in-out infinite alternate; pointer-events: none; }
    .b1 { width: 320px; height: 320px; background: #22d3ee; top: -80px; left: -80px; }
    .b2 { width: 380px; height: 380px; background: #f472b6; bottom: -120px; right: -100px; animation-delay: -5s; }
    @keyframes float { to { transform: translate(60px, 40px) scale(1.2); } }

    .wrap { position: relative; z-index: 1; max-width: 1050px; margin: 0 auto; }
    h1 { font-size: 1.6rem; background: linear-gradient(90deg, #fde047, #f472b6, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 4px; }
    .sub { color: #cbd5e1; font-size: .92rem; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1.25fr; gap: 14px; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
    .panel { background: rgba(255,255,255,.08); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.18); border-radius: 16px; padding: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
    .panel h2 { font-size: .95rem; color: #e9d5ff; margin-bottom: 8px; }

    .code { font-family: Consolas, monospace; font-size: .92rem; background: rgba(2,6,23,.7); border-radius: 10px; padding: 8px 0; overflow-x: auto; }
    .ln { display: flex; padding: 4px 12px; white-space: pre; border-left: 4px solid transparent; transition: background .25s; }
    .ln .no { width: 24px; color: #64748b; flex-shrink: 0; }
    .ln.on { background: linear-gradient(90deg, rgba(236,72,153,.7), rgba(139,92,246,.4)); border-left-color: #fde047; box-shadow: 0 0 14px rgba(236,72,153,.6); }
    .bug { color: #fb7185; font-weight: bold; }
    #msg { background: rgba(250,204,21,.15); border: 1px solid rgba(250,204,21,.5); border-radius: 10px; padding: 10px 12px; margin-top: 12px; min-height: 76px; line-height: 1.65; }
    #msg b { color: #fde047; }
    .toggle { margin-top: 10px; font-size: .88rem; color: #fda4af; cursor: pointer; }

    /* 배열 카드 */
    .shelf { display: flex; gap: 12px; margin-bottom: 14px; }
    .card { flex: 1; min-width: 0; text-align: center; padding: 10px 8px; border-radius: 14px; background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.2);
            opacity: 0; transform: translateY(20px) scale(.9); transition: all .45s cubic-bezier(.2,1.4,.4,1); }
    .card.show { opacity: .55; transform: none; }
    .card.cur { opacity: 1; transform: translateY(-8px) scale(1.04); border-color: #fde047; box-shadow: 0 0 24px rgba(253,224,71,.7); }
    .card.done { opacity: 1; border-color: #4ade80; box-shadow: 0 0 18px rgba(74,222,128,.55); }
    .card .idx { font-family: Consolas, monospace; font-weight: bold; color: #fbbf24; }
    .card .big { font-size: 2.6rem; line-height: 1.1; }
    .card .pile { font-size: .85rem; line-height: 1.15; min-height: 2.4em; word-break: break-all; margin: 4px 0; }
    .kv { font-family: Consolas, monospace; font-size: .85rem; padding: 3px 6px; margin: 3px 0; border-radius: 6px; background: rgba(0,0,0,.3); transition: all .3s; }
    .kv.hl { background: #fde047; color: #1e1b4b; font-weight: bold; transform: scale(1.08); box-shadow: 0 0 12px #fde047; }
    .kv.err { background: #fb7185; color: #fff; font-weight: bold; transform: scale(1.08); box-shadow: 0 0 12px #fb7185; }
    .stotal { font-weight: bold; color: #86efac; min-height: 1.4em; font-size: .95rem; }

    /* 변수/계산 */
    .vars { display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
    .var { flex: 1; min-width: 120px; text-align: center; padding: 8px 4px; border-radius: 12px; background: rgba(0,0,0,.3); border: 2px solid rgba(255,255,255,.2); transition: all .3s; }
    .var .name { font-family: Consolas, monospace; font-size: .82rem; color: #c4b5fd; }
    .var .val { font-family: Consolas, monospace; font-weight: bold; font-size: 1.15rem; }
    #vSum .val { font-size: 1.9rem; color: #fde047; text-shadow: 0 0 12px rgba(253,224,71,.8); }
    .var.pulse { animation: pulse .6s; border-color: #4ade80; }
    @keyframes pulse { 40% { transform: scale(1.12); box-shadow: 0 0 26px #4ade80; } }
    .calc { text-align: center; font-family: Consolas, monospace; font-size: 1.5rem; font-weight: bold; padding: 12px; border-radius: 12px; min-height: 64px;
            background: rgba(0,0,0,.35); border: 2px dashed rgba(255,255,255,.3); }
    .calc .r { color: #4ade80; text-shadow: 0 0 12px #4ade80; }
    .calc .e { color: #fb7185; text-shadow: 0 0 12px #fb7185; }
    .chip { position: fixed; z-index: 50; pointer-events: none; font-weight: bold; font-size: 1.3rem; padding: 4px 12px; border-radius: 20px; background: #4ade80; color: #052e16; box-shadow: 0 0 20px #4ade80; }
    .chip.bad { background: #fb7185; color: #fff; box-shadow: 0 0 20px #fb7185; }
    .spark { position: fixed; z-index: 50; pointer-events: none; font-size: 1.4rem; }

    .ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
    button { font: inherit; padding: 10px 16px; border: 0; border-radius: 10px; background: linear-gradient(135deg, #ec4899, #8b5cf6); color: #fff; cursor: pointer; box-shadow: 0 3px 12px rgba(139,92,246,.5); }
    button:hover { filter: brightness(1.15); }
    button.sec { background: rgba(255,255,255,.18); box-shadow: none; }
    button:disabled { opacity: .35; cursor: not-allowed; }
    #pos, label { font-size: .88rem; color: #cbd5e1; }
  </style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="wrap">
  <h1>🍎 사과 배열 × 반복문 애니메이션</h1>
  <p class="sub">배열에 든 사과 묶음 2개의 가격 × 개수를 반복문으로 모두 더합니다. [다음 ▶]을 눌러 한 줄씩 따라가 보세요.</p>

  <div class="grid">
    <div class="panel">
      <h2>📜 코드</h2>
      <div class="code" id="code"></div>
      <div id="msg"></div>
      <label class="toggle"><input type="checkbox" id="typo"> 🐞 원래 코드 그대로 보기 (<code>i.amout</code> 오타 포함)</label>
    </div>

    <div class="panel">
      <h2>🗂️ 배열 data (인덱스는 0부터!)</h2>
      <div class="shelf" id="shelf"></div>

      <div class="vars">
        <div class="var" id="vI"><div class="name">i (꺼낸 칸)</div><div class="val">-</div></div>
        <div class="var" id="vSum"><div class="name">sum (누적 합계)</div><div class="val">-</div></div>
      </div>
      <h2>🧮 계산</h2>
      <div class="calc" id="calc">&nbsp;</div>
    </div>
  </div>

  <div class="ctrl">
    <button id="prev" class="sec">◀ 이전</button>
    <button id="next">다음 ▶</button>
    <button id="play">▶▶ 자동 재생</button>
    <button id="reset" class="sec">↺ 처음부터</button>
    <label>속도 <input type="range" id="speed" min="1" max="10" value="4"></label>
    <span id="pos"></span>
  </div>
</div>

<script>
  const data = [ { apple: 100, amount: 5 }, { apple: 103, amount: 52 } ];
  const f = n => n.toLocaleString('ko-KR');

  let typo = false, steps = [], codeLines = [];

  function build() {
    const key = typo ? 'amout' : 'amount';
    codeLines = [
      'let data = [',
      '  { "사과": 100, "amount": 5  },',
      '  { "사과": 103, "amount": 52 },',
      ']',
      'let sum = 0',
      'for (i of data) {',
      '  sum += i.사과 * i.' + key,
      '}',
    ];
    steps = [];
    const s = { arr: 0, cur: -1, done: 0, hl: '', i: null, sum: null, calc: '', fly: null, bad: false };
    const push = (lines, msg) => steps.push({ lines: [].concat(lines), msg, ...s });

    s.arr = 2;
    push([0, 1, 2, 3], '<b>data</b> 배열을 만듭니다. 칸이 <b>2개</b>이고, 칸마다 <b>사과 가격</b>과 <b>amount(개수)</b>가 들어 있습니다. 칸 번호는 0, 1 입니다.');
    s.sum = 0;
    push(4, '합계를 담을 변수 <b>sum</b>을 만들고 <b>0</b>에서 시작합니다.');

    data.forEach((d, k) => {
      s.cur = k; s.i = `{ 사과:${d.apple}, amount:${d.amount} }`; s.hl = ''; s.calc = '';
      push(5, `반복 <b>${k + 1}번째</b>: 칸이 2개라서 <b>{ }</b> 안을 2번 반복합니다. 배열에서 <b>data[${k}]</b>를 꺼내 변수 <b>i</b>에 담습니다.`);

      const cnt = typo ? undefined : d.amount;
      s.hl = typo ? 'err' : 'hl';
      s.calc = `<span>${f(d.apple)}</span> × <span class="${typo ? 'e' : ''}">${typo ? 'undefined' : cnt}</span>`;
      push(6, typo
        ? `<b>i.사과</b> = ${f(d.apple)} 는 읽었지만, <b>i.amout</b>는 ❌ 그런 이름이 없습니다! (<b>amount</b>의 오타) 없는 이름을 읽으면 <b>undefined</b>가 됩니다.`
        : `<b>i.사과</b> = ${f(d.apple)}, <b>i.amount</b> = ${d.amount}. 지금 꺼낸 칸 안의 두 값을 읽습니다.`);

      const before = s.sum;
      const prod = typo ? NaN : d.apple * d.amount;
      s.sum = before + prod; s.done = k + 1; s.hl = '';
      s.bad = typo;
      s.calc = typo
        ? `${f(d.apple)} × undefined = <span class="e">NaN</span>`
        : `${f(d.apple)} × ${d.amount} = <span class="r">${f(prod)}</span>`;
      s.fly = typo ? 'NaN' : '+' + f(prod);
      push(6, typo
        ? `숫자 × undefined = <b>NaN</b>(숫자가 아님). sum에 더하면 sum도 <b>NaN</b>이 됩니다. 오타 하나로 전체 합계가 망가졌어요!`
        : `<b>sum += ${f(d.apple)} × ${d.amount}</b> → ${f(before)} + ${f(prod)} = <b>${f(s.sum)}</b>. 곱한 값을 sum에 <b>누적</b>합니다.`);
      s.fly = null;
    });

    s.cur = -1; s.i = null; s.calc = typo ? '' : '';
    push(7, typo
      ? '반복이 끝났지만 최종 <b>sum은 NaN</b> 입니다. 오른쪽 <b>amout → amount</b>로 고치면 5,856이 됩니다. (원래 코드의 <b>for (i of data)</b> 도 <b>const</b>를 붙여 for (const i of data) 로 쓰는 것이 안전합니다.)'
      : `칸을 모두 꺼냈으니 반복문을 빠져나옵니다. 최종 <b>sum = ${f(s.sum)}</b> (500 + 5,356) 🎉`);
  }

  const $ = id => document.getElementById(id);
  $('shelf').innerHTML = data.map((d, k) => `
    <div class="card">
      <div class="idx">data[${k}]</div>
      <div class="big">🍎</div>
      <div class="pile">${'🍎'.repeat(d.amount)}</div>
      <div class="kv" data-k="apple">사과: ${d.apple}</div>
      <div class="kv" data-k="amount">amount: ${d.amount}</div>
      <div class="stotal"></div>
    </div>`).join('');
  const cards = document.querySelectorAll('.card');

  function drawCode() {
    $('code').innerHTML = codeLines.map((t, n) => {
      let h = t.replace(/</g, '&lt;');
      if (typo && n === 6) h = h.replace('amout', '<span class="bug">amout</span>');
      return `<div class="ln" data-n="${n}"><span class="no">${n + 1}</span>${h}</div>`;
    }).join('');
  }

  let shown = 0, raf = null;
  function tween(to, bad) {
    clearInterval(raf);
    if (to === null) { $('vSum').querySelector('.val').textContent = '-'; shown = 0; return; }
    if (bad) { $('vSum').querySelector('.val').textContent = 'NaN'; return; }
    const from = shown, t0 = Date.now();
    raf = setInterval(() => {
      const p = Math.min(1, (Date.now() - t0) / 600);
      shown = Math.round(from + (to - from) * p);
      $('vSum').querySelector('.val').textContent = f(shown);
      if (p >= 1) clearInterval(raf);
    }, 30);
  }

  function fly(text, k, bad) {
    const from = cards[k].getBoundingClientRect(), to = $('vSum').getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'chip' + (bad ? ' bad' : '');
    el.textContent = text;
    document.body.appendChild(el);
    const sx = from.left + from.width / 2 - 30, sy = from.top + 20;
    const ex = to.left + to.width / 2 - 30, ey = to.top + 10;
    el.animate([
      { transform: `translate(${sx}px,${sy}px) scale(.6)`, opacity: 0 },
      { transform: `translate(${sx}px,${sy - 30}px) scale(1.2)`, opacity: 1, offset: .25 },
      { transform: `translate(${ex}px,${ey}px) scale(1)`, opacity: 1 },
    ], { duration: 1000, easing: 'ease-in-out' }).onfinish = () => {
      el.remove();
      $('vSum').classList.remove('pulse'); void $('vSum').offsetWidth; $('vSum').classList.add('pulse');
    };
  }

  function sparkle() {
    const r = $('vSum').getBoundingClientRect();
    for (let n = 0; n < 16; n++) {
      const el = document.createElement('div');
      el.className = 'spark'; el.textContent = ['✨', '🎉', '⭐', '🍎'][n % 4];
      document.body.appendChild(el);
      const x = r.left + r.width / 2, y = r.top + 20, ang = Math.random() * 6.28, dist = 80 + Math.random() * 120;
      el.animate([
        { transform: `translate(${x}px,${y}px)`, opacity: 1 },
        { transform: `translate(${x + Math.cos(ang) * dist}px,${y + Math.sin(ang) * dist}px) rotate(300deg)`, opacity: 0 },
      ], { duration: 1200, easing: 'ease-out' }).onfinish = () => el.remove();
    }
  }

  let pos = -1, timer = null;
  const empty = { lines: [], msg: '아직 시작 전입니다. <b>다음 ▶</b> 버튼을 눌러 보세요!', arr: 0, cur: -1, done: 0, hl: '', i: null, sum: null, calc: '', fly: null, bad: false };

  function render(forward) {
    const s = pos < 0 ? empty : steps[pos];
    document.querySelectorAll('.ln').forEach(el => el.classList.toggle('on', s.lines.includes(+el.dataset.n)));
    $('msg').innerHTML = s.msg;
    cards.forEach((c, k) => {
      c.className = 'card' + (k < s.arr ? ' show' : '') + (k < s.done ? ' done' : '') + (k === s.cur ? ' cur' : '');
      c.querySelectorAll('.kv').forEach(kv => {
        kv.classList.remove('hl', 'err');
        if (k === s.cur && s.hl) {
          if (kv.dataset.k === 'apple') kv.classList.add('hl');
          if (kv.dataset.k === 'amount') kv.classList.add(s.hl);
        }
      });
      c.querySelector('.stotal').textContent = k < s.done ? (typo ? '소계 NaN' : '소계 ' + f(data[k].apple * data[k].amount)) : '';
    });
    $('vI').querySelector('.val').textContent = s.i === null ? '-' : s.i;
    $('vI').querySelector('.val').style.fontSize = s.i === null ? '' : '.78rem';
    $('calc').innerHTML = s.calc || '&nbsp;';
    tween(s.sum, Number.isNaN(s.sum));
    if (forward && s.fly) fly(s.fly, s.cur, s.bad);
    if (forward && pos === steps.length - 1 && !typo) sparkle();
    $('pos').textContent = `${pos + 1} / ${steps.length} 단계`;
    $('prev').disabled = pos < 0;
    $('next').disabled = pos >= steps.length - 1;
    if (pos >= steps.length - 1) stop();
  }

  function go(n) { const old = pos; pos = Math.max(-1, Math.min(steps.length - 1, n)); render(pos === old + 1); }
  function stop() { clearInterval(timer); timer = null; $('play').textContent = '▶▶ 자동 재생'; }
  function play() {
    if (timer) return stop();
    if (pos >= steps.length - 1) { pos = -1; }
    $('play').textContent = '⏸ 일시정지';
    timer = setInterval(() => go(pos + 1), 2600 - $('speed').value * 200);
    go(pos + 1);
  }
  function init() { stop(); build(); drawCode(); pos = -1; render(false); }

  $('next').onclick = () => { stop(); go(pos + 1); };
  $('prev').onclick = () => { stop(); go(pos - 1); };
  $('reset').onclick = () => { stop(); go(-1); };
  $('play').onclick = play;
  $('speed').oninput = () => { if (timer) { stop(); play(); } };
  $('typo').onchange = e => { typo = e.target.checked; init(); };

  init();
</script>
</body>
</html>
