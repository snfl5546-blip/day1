<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장바구니 배열 반복문 애니메이션</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Malgun Gothic", sans-serif; color: #f8fafc; padding: 16px; min-height: 100vh;
      background: linear-gradient(135deg, #1e1b4b, #4c1d95 50%, #831843); background-attachment: fixed; overflow-x: hidden;
    }
    .blob { position: fixed; border-radius: 50%; filter: blur(70px); opacity: .35; z-index: 0; animation: float 12s ease-in-out infinite alternate; pointer-events: none; }
    .b1 { width: 320px; height: 320px; background: #22d3ee; top: -80px; left: -80px; }
    .b2 { width: 380px; height: 380px; background: #f472b6; bottom: -120px; right: -100px; animation-delay: -5s; }
    @keyframes float { to { transform: translate(60px, 40px) scale(1.2); } }

    .wrap { position: relative; z-index: 1; max-width: 1200px; margin: 0 auto; }
    h1 { font-size: 1.6rem; background: linear-gradient(90deg, #fde047, #f472b6, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; margin-bottom: 4px; }
    .sub { color: #cbd5e1; font-size: .92rem; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1.15fr; gap: 14px; align-items: start; }
    @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
    .panel { background: rgba(255,255,255,.08); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,.18); border-radius: 16px; padding: 14px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
    .panel > h2 { font-size: 1.05rem; color: #fde68a; margin-bottom: 10px; }
    .panel h3 { font-size: .88rem; color: #e9d5ff; margin: 12px 0 6px; }

    /* ===== 왼쪽: 장바구니 ===== */
    .adder { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
    select, input[type=number] { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid rgba(255,255,255,.3); background: rgba(2,6,23,.6); color: #fff; }
    select { flex: 1; min-width: 150px; }
    input[type=number] { width: 80px; }
    .cartlist { height: 430px; overflow-y: auto; border-radius: 12px; background: rgba(2,6,23,.45); padding: 6px; scroll-behavior: smooth; }
    .row { display: grid; grid-template-columns: 62px 1fr auto; gap: 8px; align-items: center; padding: 6px 10px; margin-bottom: 4px; border-radius: 10px;
           background: rgba(255,255,255,.07); border: 2px solid transparent; font-size: .9rem; transition: all .3s; }
    .row .ix { font-family: Consolas, monospace; font-size: .78rem; color: #fbbf24; }
    .row .nm .em { font-size: 1.25rem; margin-right: 4px; }
    .row .nm small { display: block; color: #94a3b8; font-size: .74rem; }
    .row .st { font-family: Consolas, monospace; font-weight: bold; color: #64748b; text-align: right; min-width: 78px; }
    .row.cur { background: rgba(253,224,71,.22); border-color: #fde047; box-shadow: 0 0 18px rgba(253,224,71,.6); transform: scale(1.02); }
    .row.done .st { color: #86efac; }
    .row.done { background: rgba(74,222,128,.12); }
    .row.newrow { animation: pop .8s; }
    @keyframes pop { 0% { transform: scale(.5); background: #4ade80; } 100% { transform: scale(1); } }
    .carttotal { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding: 10px 14px; border-radius: 12px;
                 background: rgba(253,224,71,.15); border: 2px dashed #fbbf24; }
    .carttotal b { font-size: 1.5rem; color: #fde047; font-family: Consolas, monospace; text-shadow: 0 0 12px rgba(253,224,71,.7); }

    /* ===== 오른쪽: 로직 ===== */
    .code { font-family: Consolas, monospace; font-size: .92rem; background: rgba(2,6,23,.7); border-radius: 10px; padding: 8px 0; overflow-x: auto; }
    .ln { display: flex; padding: 4px 12px; white-space: pre; border-left: 4px solid transparent; transition: background .25s; }
    .ln .no { width: 24px; color: #64748b; flex-shrink: 0; }
    .ln.on { background: linear-gradient(90deg, rgba(236,72,153,.7), rgba(139,92,246,.4)); border-left-color: #fde047; box-shadow: 0 0 14px rgba(236,72,153,.6); }
    #msg { background: rgba(250,204,21,.15); border: 1px solid rgba(250,204,21,.5); border-radius: 10px; padding: 10px 12px; margin-top: 10px; min-height: 84px; line-height: 1.65; }
    #msg b { color: #fde047; }
    .vars { display: flex; gap: 8px; flex-wrap: wrap; }
    .var { flex: 1; min-width: 100px; text-align: center; padding: 8px 4px; border-radius: 12px; background: rgba(0,0,0,.3); border: 2px solid rgba(255,255,255,.2); transition: all .3s; }
    .var .name { font-family: Consolas, monospace; font-size: .78rem; color: #c4b5fd; }
    .var .val { font-family: Consolas, monospace; font-weight: bold; font-size: 1.05rem; }
    .var .val.sm { font-size: .78rem; }
    #vSum { flex: 1.3; }
    #vSum .val { font-size: 1.7rem; color: #fde047; text-shadow: 0 0 12px rgba(253,224,71,.8); }
    .var.pulse { animation: pulse .6s; border-color: #4ade80; }
    @keyframes pulse { 40% { transform: scale(1.1); box-shadow: 0 0 26px #4ade80; } }
    .calc { text-align: center; font-family: Consolas, monospace; font-size: 1.25rem; font-weight: bold; padding: 10px; border-radius: 12px; min-height: 54px;
            background: rgba(0,0,0,.35); border: 2px dashed rgba(255,255,255,.3); }
    .calc .r { color: #4ade80; text-shadow: 0 0 12px #4ade80; }
    #strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(26px, 1fr)); gap: 3px; }
    .cell { text-align: center; font-size: .66rem; padding: 4px 0; border-radius: 5px; background: rgba(255,255,255,.12); color: #94a3b8; font-family: Consolas, monospace; transition: all .2s; }
    .cell.done { background: #22c55e; color: #052e16; }
    .cell.cur { background: #f97316; color: #fff; transform: scale(1.35); font-weight: bold; box-shadow: 0 0 10px #f97316; }
    .bar { height: 10px; border-radius: 6px; background: rgba(255,255,255,.15); overflow: hidden; margin-top: 8px; }
    .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #22d3ee, #4ade80); transition: width .3s; }
    .cnt { font-size: .85rem; color: #cbd5e1; margin-top: 4px; text-align: right; }

    .chip { position: fixed; z-index: 50; pointer-events: none; left: 0; top: 0; font-weight: bold; font-size: 1.1rem; padding: 3px 12px; border-radius: 20px; background: #4ade80; color: #052e16; box-shadow: 0 0 20px #4ade80; }
    .spark { position: fixed; z-index: 50; pointer-events: none; left: 0; top: 0; font-size: 1.4rem; }

    .ctrl { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 14px; }
    button { font: inherit; padding: 9px 14px; border: 0; border-radius: 10px; background: linear-gradient(135deg, #ec4899, #8b5cf6); color: #fff; cursor: pointer; box-shadow: 0 3px 12px rgba(139,92,246,.5); }
    button:hover { filter: brightness(1.15); }
    button.sec { background: rgba(255,255,255,.18); box-shadow: none; }
    button.add { background: linear-gradient(135deg, #10b981, #06b6d4); }
    button:disabled { opacity: .35; cursor: not-allowed; }
    #pos, label { font-size: .88rem; color: #cbd5e1; }
  </style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>
<div class="wrap">
  <h1>🛒 장바구니로 배우는 배열 + 반복문</h1>
  <p class="sub">왼쪽은 <b>장바구니</b>, 오른쪽은 <b>컴퓨터가 합계를 계산하는 과정</b>입니다. [다음 ▶] 또는 [▶▶ 자동 재생]을 눌러 보세요. 상품은 직접 더 담을 수도 있어요!</p>

  <div class="grid">
    <!-- 왼쪽: 장바구니 -->
    <section class="panel">
      <h2>🛒 내 장바구니 <small style="color:#cbd5e1;font-weight:normal">(= 배열 data)</small></h2>
      <div class="adder">
        <select id="prod"></select>
        <input type="number" id="qty" min="1" max="99" value="3" aria-label="개수">
        <button class="add" id="add">➕ 장바구니에 담기</button>
      </div>
      <div class="cartlist" id="cart"></div>
      <div class="carttotal"><span>🧺 <span id="cn"></span>가지 상품 · 계산된 합계</span><b id="ctot">0원</b></div>
    </section>

    <!-- 오른쪽: 로직 애니메이션 -->
    <section class="panel">
      <h2>🧠 컴퓨터는 이렇게 계산해요</h2>
      <div class="code" id="code"></div>
      <div id="msg"></div>

      <h3>📦 변수 (컴퓨터 메모리)</h3>
      <div class="vars">
        <div class="var" id="vI"><div class="name">i (지금 꺼낸 상품)</div><div class="val">-</div></div>
        <div class="var" id="vSum"><div class="name">sum (누적 합계)</div><div class="val">-</div></div>
      </div>

      <h3>🧮 계산</h3>
      <div class="calc" id="calc">&nbsp;</div>

      <h3>🔢 배열 칸 진행 상황 (주황: 지금 / 초록: 완료)</h3>
      <div id="strip"></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="cnt" id="cnt"></div>
    </section>
  </div>

  <div class="ctrl">
    <button id="prev" class="sec">◀ 이전</button>
    <button id="next">다음 ▶</button>
    <button id="iter" class="sec">⏭ 반복 1회씩</button>
    <button id="play">▶▶ 자동 재생</button>
    <button id="skip" class="sec">⏩ 반복문 끝으로</button>
    <button id="reset" class="sec">↺ 처음부터</button>
    <label>속도 <input type="range" id="speed" min="1" max="10" value="5"></label>
    <span id="pos"></span>
  </div>
</div>

<script>
  // ===== 상품 종류 =====
  const kinds = [
    { em: '🍎', name: '사과',   price: 100 },
    { em: '🍐', name: '배',     price: 1000 },
    { em: '🍊', name: '귤',     price: 10000 },
    { em: '🍌', name: '바나나', price: 500 },
    { em: '🍇', name: '포도',   price: 3000 },
    { em: '🍉', name: '수박',   price: 15000 },
    { em: '🍓', name: '딸기',   price: 2000 },
    { em: '🍑', name: '복숭아', price: 1500 },
    { em: '🥝', name: '키위',   price: 800 },
    { em: '🍋', name: '레몬',   price: 700 },
  ];
  // 배열 data: 장바구니 50칸 (개수는 규칙적으로 1~9개)
  const data = [];
  for (let k = 0; k < 50; k++) {
    const kd = kinds[k % kinds.length];
    data.push({ ...kd, qty: (k * 7) % 9 + 1 });
  }

  const $ = id => document.getElementById(id);
  const f = n => n.toLocaleString('ko-KR');
  const won = n => f(n) + '원';

  $('prod').innerHTML = kinds.map((k, n) => `<option value="${n}">${k.em} ${k.name} (${won(k.price)})</option>`).join('');

  // ===== 화면에 보여줄 코드 =====
  function codeLines() {
    return [
      `let data = [ {...}, {...}, ... ]   // 장바구니 ${data.length}칸`,
      'let sum = 0',
      'for (const i of data) {',
      '  sum += i.price * i.qty',
      '}',
      'console.log(sum)',
    ];
  }

  // ===== 실행 단계 미리 계산 =====
  let steps = [], LOOP_END = 0;
  function build() {
    const N = data.length;
    steps = [];
    const s = { cur: -1, done: 0, i: null, sum: null, calc: '', fly: null, show: false, final: false };
    const push = (lines, msg) => steps.push({ lines: [].concat(lines), msg, ...s });

    s.show = true;
    push(0, `<b>data</b>는 <b>배열</b>입니다. 왼쪽 장바구니의 상품 <b>${N}개</b>가 한 칸씩 줄 서 있고, 칸 번호는 <b>0부터 ${N - 1}</b>까지입니다.`);
    s.sum = 0;
    push(1, '합계를 담을 상자 <b>sum</b>을 만들고 <b>0원</b>에서 시작합니다.');

    data.forEach((d, k) => {
      s.cur = k; s.i = `${d.em} ${d.name} ${d.price}원×${d.qty}`; s.calc = ''; s.fly = null;
      push(2, k === 0
        ? `<b>반복문 시작!</b> 배열에서 <b>첫 칸 data[0]</b>을 꺼내 변수 <b>i</b>에 담습니다. 왼쪽에서 노랗게 빛나는 줄이에요.`
        : k === 1
          ? `<b>이제 data[1]</b>을 꺼냅니다. 방금과 <b>똑같은 일</b>을 칸 수(${N}번)만큼 컴퓨터가 알아서 반복합니다!`
          : `반복 <b>${k + 1}번째</b>: <b>data[${k}]</b> ${d.em} ${d.name}을(를) 꺼내 <b>i</b>에 담습니다.`);

      const before = s.sum, prod = d.price * d.qty;
      s.sum = before + prod; s.done = k + 1;
      s.calc = `${f(d.price)} × ${d.qty} = <span class="r">${f(prod)}</span>`;
      s.fly = '+' + f(prod);
      push(3, `<b>sum += i.price × i.qty</b> → ${f(before)} + (${f(d.price)} × ${d.qty}) = <b>${won(s.sum)}</b><br>꺼낸 상품의 (가격 × 개수)를 sum에 계속 <b>더해 쌓습니다</b>(누적).`);
    });

    s.cur = -1; s.i = null; s.calc = ''; s.fly = null;
    push(4, `배열의 <b>${N}칸을 모두 꺼냈으므로</b> 반복문을 빠져나옵니다. 사람이 ${N}번 계산할 일을 반복문이 한 번에 끝냈어요!`);
    s.final = true;
    push(5, `최종 <b>sum = ${won(s.sum)}</b> 🎉 이것이 장바구니 총 구매 가격입니다.`);
    LOOP_END = steps.findIndex(x => x.lines[0] === 4);
  }

  // ===== 화면 그리기 =====
  let rows = [], cells = [], notice = '';
  function drawCart(newIdx) {
    $('cart').innerHTML = data.map((d, k) => `
      <div class="row${k === newIdx ? ' newrow' : ''}">
        <div class="ix">data[${k}]</div>
        <div class="nm"><span class="em">${d.em}</span>${d.name}<small>${f(d.price)}원 × ${d.qty}개</small></div>
        <div class="st">?</div>
      </div>`).join('');
    rows = [...document.querySelectorAll('.row')];
    $('strip').innerHTML = data.map((_, k) => `<div class="cell">${k}</div>`).join('');
    cells = [...document.querySelectorAll('.cell')];
    $('cn').textContent = data.length;
  }
  function drawCode() {
    $('code').innerHTML = codeLines().map((t, n) =>
      `<div class="ln" data-n="${n}"><span class="no">${n + 1}</span>${t.replace(/</g, '&lt;')}</div>`).join('');
  }

  let shown = 0, tmr = null;
  function tween(el, to, fmt) {
    clearInterval(tmr);
    if (to === null) { el.textContent = '-'; shown = 0; return; }
    const from = shown, t0 = Date.now();
    tmr = setInterval(() => {
      const p = Math.min(1, (Date.now() - t0) / 450);
      shown = Math.round(from + (to - from) * p);
      el.textContent = fmt(shown);
      $('ctot').textContent = won(shown);
      if (p >= 1) clearInterval(tmr);
    }, 30);
  }

  function fly(text, k, ms) {
    const a = rows[k].getBoundingClientRect(), b = $('vSum').getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'chip'; el.textContent = text;
    document.body.appendChild(el);
    const sx = a.right - 90, sy = a.top + a.height / 2 - 12, ex = b.left + b.width / 2 - 30, ey = b.top + 10;
    el.animate([
      { transform: `translate(${sx}px,${sy}px) scale(.7)`, opacity: .2 },
      { transform: `translate(${sx + 20}px,${sy - 14}px) scale(1.15)`, opacity: 1, offset: .2 },
      { transform: `translate(${ex}px,${ey}px) scale(1)`, opacity: 1 },
    ], { duration: ms, easing: 'ease-in-out' }).onfinish = () => {
      el.remove();
      $('vSum').classList.remove('pulse'); void $('vSum').offsetWidth; $('vSum').classList.add('pulse');
    };
  }
  function sparkle() {
    const r = $('vSum').getBoundingClientRect();
    for (let n = 0; n < 20; n++) {
      const el = document.createElement('div');
      el.className = 'spark'; el.textContent = ['✨', '🎉', '⭐', '🍎', '🍊'][n % 5];
      document.body.appendChild(el);
      const x = r.left + r.width / 2, y = r.top + 20, ang = Math.random() * 6.28, dist = 90 + Math.random() * 140;
      el.animate([
        { transform: `translate(${x}px,${y}px)`, opacity: 1 },
        { transform: `translate(${x + Math.cos(ang) * dist}px,${y + Math.sin(ang) * dist}px) rotate(300deg)`, opacity: 0 },
      ], { duration: 1300, easing: 'ease-out' }).onfinish = () => el.remove();
    }
  }

  let pos = -1, timer = null;
  const empty = () => ({ lines: [], msg: notice || '아직 시작 전입니다. <b>다음 ▶</b>을 눌러 보세요! 처음엔 한 줄씩 천천히, 이해되면 <b>▶▶ 자동 재생</b>이나 <b>⏭ 반복 1회씩</b>을 써 보세요.',
    cur: -1, done: 0, i: null, sum: null, calc: '', fly: null, show: false, final: false });

  function render(forward) {
    const s = pos < 0 ? empty() : steps[pos];
    document.querySelectorAll('.ln').forEach(el => el.classList.toggle('on', s.lines.includes(+el.dataset.n)));
    $('msg').innerHTML = s.msg;
    rows.forEach((r, k) => {
      r.classList.toggle('cur', k === s.cur);
      r.classList.toggle('done', k < s.done);
      r.querySelector('.st').textContent = k < s.done ? won(data[k].price * data[k].qty) : '?';
    });
    cells.forEach((c, k) => {
      c.classList.toggle('cur', k === s.cur);
      c.classList.toggle('done', k < s.done);
    });
    if (s.cur >= 0 && rows[s.cur]) {
      const box = $('cart');
      box.scrollTop = rows[s.cur].offsetTop - box.clientHeight / 2 + rows[s.cur].clientHeight / 2;
    } else if (s.cur < 0 && s.done === 0) $('cart').scrollTop = 0;
    $('vI').querySelector('.val').textContent = s.i === null ? '-' : s.i;
    $('vI').querySelector('.val').classList.toggle('sm', s.i !== null);
    $('calc').innerHTML = s.calc || '&nbsp;';
    tween($('vSum').querySelector('.val'), s.sum, won);
    if (s.sum === null) $('ctot').textContent = '0원';
    const pct = data.length ? s.done / data.length * 100 : 0;
    $('bar').style.width = pct + '%';
    $('cnt').textContent = `반복 ${s.done} / ${data.length} 번 완료`;
    const ms = Math.max(300, Math.min(1000, delay() * 0.9));
    if (forward && s.fly && s.cur >= 0) fly(s.fly, s.cur, ms);
    if (forward && s.final) sparkle();
    $('pos').textContent = `${pos + 1} / ${steps.length} 단계`;
    $('prev').disabled = pos < 0;
    $('next').disabled = $('iter').disabled = pos >= steps.length - 1;
    $('skip').disabled = pos >= LOOP_END;
    if (pos >= steps.length - 1) stop();
  }

  const delay = () => Math.max(120, 2700 - $('speed').value * 250);
  function go(n) { const old = pos; pos = Math.max(-1, Math.min(steps.length - 1, n)); render(pos === old + 1); }
  function stop() { clearInterval(timer); timer = null; $('play').textContent = '▶▶ 자동 재생'; }
  function play() {
    if (timer) return stop();
    if (pos >= steps.length - 1) pos = -1;
    $('play').textContent = '⏸ 일시정지';
    timer = setInterval(() => go(pos + 1), delay());
    go(pos + 1);
  }
  function nextIter() {
    // 다음 '꺼내기' 줄(2번 줄) 또는 반복문 끝으로
    let n = pos + 1;
    while (n < steps.length - 1 && steps[n].lines[0] !== 2 && steps[n].lines[0] !== 4) n++;
    go(n);
  }
  function init(newIdx) { stop(); build(); drawCode(); drawCart(newIdx); pos = -1; shown = 0; render(false); }

  $('next').onclick = () => { stop(); go(pos + 1); };
  $('prev').onclick = () => { stop(); go(pos - 1); };
  $('iter').onclick = () => { stop(); nextIter(); };
  $('skip').onclick = () => { stop(); go(LOOP_END); };
  $('reset').onclick = () => { stop(); notice = ''; go(-1); };
  $('play').onclick = play;
  $('speed').oninput = () => { if (timer) { stop(); play(); } };
  $('add').onclick = () => {
    const kd = kinds[+$('prod').value];
    const qty = Math.max(1, Math.min(99, parseInt($('qty').value, 10) || 1));
    data.push({ ...kd, qty });
    notice = `<b>data.push({ ${kd.name}, ${kd.price}원, ${qty}개 })</b> 로 배열 맨 뒤(<b>data[${data.length - 1}]</b>)에 새 칸이 추가되었습니다. 이제 총 ${data.length}칸! <b>다음 ▶</b>을 누르면 새 상품까지 포함해 다시 계산합니다.`;
    init(data.length - 1);
    const box = $('cart'); box.scrollTop = box.scrollHeight;
  };

  init();
</script>
</body>
</html>
